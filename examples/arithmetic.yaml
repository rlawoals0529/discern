# A suite small enough to be run in a README and large enough to make the point: twenty
# items is where a ten-point difference still means nothing, which is the number most eval
# reports are built on.
label: arithmetic
items:
  - { id: add-1, prompt: "2 + 2", expected: "4" }
  - { id: add-2, prompt: "17 + 25", expected: "42" }
  - { id: add-3, prompt: "999 + 1", expected: "1000" }
  - { id: sub-1, prompt: "10 - 3", expected: "7" }
  - { id: sub-2, prompt: "100 - 47", expected: "53" }
  - { id: mul-1, prompt: "6 * 7", expected: "42" }
  - { id: mul-2, prompt: "12 * 12", expected: "144" }
  - { id: mul-3, prompt: "25 * 4", expected: "100" }
  - { id: div-1, prompt: "144 / 12", expected: "12" }
  - { id: div-2, prompt: "100 / 8", expected: "12.5" }
  - { id: pct-1, prompt: "15% of 200", expected: "30" }
  - { id: pct-2, prompt: "what is 7% of 350", expected: "24.5" }
  - { id: ord-1, prompt: "2 + 3 * 4", expected: "14" }
  - { id: ord-2, prompt: "(2 + 3) * 4", expected: "20" }
  - { id: neg-1, prompt: "-2 ^ 2", expected: "-4" }
  - { id: big-1, prompt: "2 ^ 32", expected: "4294967296" }
  - { id: frac-1, prompt: "1/3 + 1/6", expected: "1/2" }
  - { id: word-1, prompt: "a shirt is $40 with 25% off", expected: "30" }
  - { id: word-2, prompt: "3 apples at 60c, paid with $5", expected: "3.20" }
  - { id: word-3, prompt: "60 km at 90 km/h", expected: "40 minutes" }
