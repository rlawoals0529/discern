name: CI
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    services:
      # A real Postgres, because the service tests are about a schema: a unique constraint,
      # timezone-aware timestamps and a migration that has to be right. An in-memory stand-in
      # would exercise none of those, so testing the fake would prove nothing.
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: discern
          POSTGRES_PASSWORD: discern
          POSTGRES_DB: discern
        ports: ["5434:5432"]
        options: >-
          --health-cmd "pg_isready -U discern"
          --health-interval 2s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
      - run: uv sync --python ${{ matrix.python }}
      - run: uv run ruff check src tests scripts
      - run: uv run alembic upgrade head
      - run: uv run pytest -q

  migration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: discern
          POSTGRES_PASSWORD: discern
          POSTGRES_DB: discern
        ports: ["5434:5432"]
        options: >-
          --health-cmd "pg_isready -U discern"
          --health-interval 2s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
      - run: uv sync
      - run: uv run alembic upgrade head
      - run: uv run alembic check

  deps:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
      - run: uv sync
      - run: uv run python scripts/check_no_provider.py
      - name: Audit Python dependencies
        run: uv run --with pip-audit pip-audit

  port:
    name: The port still agrees with the Python
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 22 }
      - run: uv sync
      - run: npm ci --ignore-scripts
      - name: The vectors are the Python's, and current
        run: uv run python scripts/check_vectors.py
      - run: npm run typecheck
      - run: npm test

  site:
    name: The page works in a browser
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 22 }
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

  readme:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
      - run: uv sync
      - run: |
          uv run discern run examples/arithmetic.yaml --label prompt-a --fail add-3 div-2 --out a.json
          uv run discern run examples/arithmetic.yaml --label prompt-b --fail add-3 --out b.json
          uv run discern compare a.json b.json
